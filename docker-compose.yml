name: camara-pipeline

networks:
  camara-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  zookeeper_data:
  zookeeper_log:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:

x-pipeline-environment: &pipeline-environment
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-camara-kafka:9092,camara-kafka-2:9092,camara-kafka-3:9092}
  KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW:-radius.accounting.raw}
  REDIS_HOST: ${REDIS_HOST:-camara-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-camara_redis_dev_secret}
  REDIS_DB: ${REDIS_DB:-0}
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_LOCAL_USER:-postgres}:${POSTGRES_LOCAL_PASSWORD:-camara}@camara-postgres:5432/${POSTGRES_LOCAL_DB:-camara_db}}
  DB_POOL_MIN: ${PIPELINE_DB_POOL_MIN:-6}
  DB_POOL_MAX: ${PIPELINE_DB_POOL_MAX:-24}
  PIPELINE_SLA_E2E_P95_MS: ${PIPELINE_SLA_E2E_P95_MS:-100}
  PIPELINE_E2E_WINDOW_SAMPLE_LIMIT: ${PIPELINE_E2E_WINDOW_SAMPLE_LIMIT:-100000}
  PROCESSING_PARTITION_QUEUE_HIGH_RATIO: ${PROCESSING_PARTITION_QUEUE_HIGH_RATIO:-0.75}
  PROCESSING_PARTITION_QUEUE_LOW_RATIO: ${PROCESSING_PARTITION_QUEUE_LOW_RATIO:-0.25}
  PROCESSING_PARTITION_QUEUE_MAX_AGE_MS: ${PROCESSING_PARTITION_QUEUE_MAX_AGE_MS:-12}
  PROCESSING_PARTITION_QUEUE_RESUME_AGE_MS: ${PROCESSING_PARTITION_QUEUE_RESUME_AGE_MS:-4}
  PROCESSING_COMMIT_INTERVAL_MS: ${PROCESSING_COMMIT_INTERVAL_MS:-25}
  PROCESSING_COMMIT_MAX_RECORDS: ${PROCESSING_COMMIT_MAX_RECORDS:-512}
  PROCESSING_COMMIT_MAX_FAILURES: ${PROCESSING_COMMIT_MAX_FAILURES:-5}
  PROCESSING_COMMIT_RETRY_BACKOFF_MS: ${PROCESSING_COMMIT_RETRY_BACKOFF_MS:-25}
  PROCESSING_COMBINE_WAIT_MS: ${PROCESSING_COMBINE_WAIT_MS:-2}
  PROCESSING_COMBINE_MAX_RECORDS: ${PROCESSING_COMBINE_MAX_RECORDS:-64}
  PROCESSING_COMBINE_QUEUE_BATCHES: ${PROCESSING_COMBINE_QUEUE_BATCHES:-64}

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: camara-zookeeper
    restart: unless-stopped
    networks: [camara-network]
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: ${ZOOKEEPER_MEM_LIMIT:-256m}

  kafka-1: &kafka-broker
    image: confluentinc/cp-kafka:7.5.0
    container_name: camara-kafka
    restart: unless-stopped
    # Kafka cần thời gian đóng replica/log và xóa ephemeral broker-id khỏi
    # ZooKeeper. Timeout mặc định 10s có thể SIGKILL broker cũ (exit 137), làm
    # container mới gặp NodeExists cho tới khi ZooKeeper hết session timeout.
    stop_grace_period: 60s
    depends_on:
      zookeeper:
        condition: service_healthy
    networks: [camara-network]
    ports:
      - "127.0.0.1:29092:29092"
    environment: &kafka-broker-env
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: camara-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://camara-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # F-KAFKA-HA: 3 broker -> replication factor 3 mặc định cho mọi topic hệ thống
      # tự tạo (offsets/transaction), và min.insync.replicas=2 để chịu được 1 broker
      # chết mà vẫn ghi được (acks=all chỉ cần 2/3 ISR ack).
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_MIN_INSYNC_REPLICAS:-2}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-2}
      # reset.sh cần xóa topic nghiệp vụ một cách tường minh. Khai báo rõ thay
      # vì phụ thuộc default khác nhau giữa các Kafka image/version.
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: "5"
      KAFKA_LEADER_IMBALANCE_PER_BROKER_PERCENTAGE: "1"
      KAFKA_NUM_NETWORK_THREADS: ${KAFKA_NUM_NETWORK_THREADS:-8}
      KAFKA_NUM_IO_THREADS: ${KAFKA_NUM_IO_THREADS:-16}
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512M -Xmx512M}
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    mem_limit: ${KAFKA_MEM_LIMIT:-3g}
    cpus: ${KAFKA_CPUS:-1.5}

  kafka-2:
    <<: *kafka-broker
    environment:
      <<: *kafka-broker-env
      KAFKA_BROKER_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://camara-kafka-2:9092,PLAINTEXT_HOST://localhost:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29093
    ports:
      - "127.0.0.1:29093:29093"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    container_name: camara-kafka-2

  kafka-3:
    <<: *kafka-broker
    environment:
      <<: *kafka-broker-env
      KAFKA_BROKER_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://camara-kafka-3:9092,PLAINTEXT_HOST://localhost:29094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29094
    ports:
      - "127.0.0.1:29094:29094"
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    container_name: camara-kafka-3

  postgres:
    image: postgres:15-alpine
    container_name: camara-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-on}", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}", "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}", "-c", "work_mem=${POSTGRES_WORK_MEM:-8MB}", "-c", "max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}", "-c", "checkpoint_timeout=15min"]
    networks: [camara-network]
    environment:
      POSTGRES_USER: ${POSTGRES_LOCAL_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_LOCAL_PASSWORD:-camara}
      POSTGRES_DB: ${POSTGRES_LOCAL_DB:-camara_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_LOCAL_USER:-postgres} -d ${POSTGRES_LOCAL_DB:-camara_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEM_LIMIT:-3g}
    cpus: ${POSTGRES_CPUS:-2.5}

  redis:
    image: redis:7-alpine
    container_name: camara-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-camara_redis_dev_secret}", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "noeviction"]
    networks: [camara-network]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-camara_redis_dev_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${REDIS_MEM_LIMIT:-640m}
    cpus: ${REDIS_CPUS:-0.5}

  migrate:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    networks: [camara-network]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *pipeline-environment
    command: ["python", "-m", "storage.migrate"]
    restart: "no"

  fastapi:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fastapi-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [camara-network]
    ports:
      - "8000:8000"
    environment:
      <<: *pipeline-environment
      DB_POOL_SIZE: "10"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_KEY: ${API_KEY:-dev-secret}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: ${FASTAPI_MEM_LIMIT:-512m}

  pipeline-ip-msisdn:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [camara-network]
    environment:
      <<: *pipeline-environment
      PIPELINE_GROUPS: ip-msisdn
      METRICS_PORT: ${METRICS_PORT_IP_MSISDN:-9200}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-16}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      CONSUMERS_PER_GROUP: ${IP_MSISDN_CONSUMERS_PER_GROUP:-1}
      DB_APPLICATION_NAME: camara-ip-msisdn
      DATABASE_URL: ${IP_MSISDN_DATABASE_URL:-${DATABASE_URL:-postgresql://${POSTGRES_LOCAL_USER:-postgres}:${POSTGRES_LOCAL_PASSWORD:-camara}@camara-postgres:5432/${POSTGRES_LOCAL_DB:-camara_db}}}
      REDIS_HOST: ${IP_MSISDN_REDIS_HOST:-${REDIS_HOST:-camara-redis}}
      REDIS_PORT: ${IP_MSISDN_REDIS_PORT:-${REDIS_PORT:-6379}}
      REDIS_PASSWORD: ${IP_MSISDN_REDIS_PASSWORD:-${REDIS_PASSWORD:-camara_redis_dev_secret}}
      REDIS_DB: ${IP_MSISDN_REDIS_DB:-0}
      BATCH_MAX_RECORDS: ${IP_MSISDN_BATCH_MAX_RECORDS:-16}
      BATCH_TIMEOUT_MS: ${IP_MSISDN_BATCH_TIMEOUT_MS:-2}
      PROCESSING_PARTITION_CONCURRENCY: ${IP_MSISDN_PARTITION_CONCURRENCY:-2}
      PROCESSING_PARTITION_QUEUE_RECORDS: ${IP_MSISDN_PARTITION_QUEUE_RECORDS:-64}
      THROUGHPUT_LOG_INTERVAL_SECONDS: ${THROUGHPUT_LOG_INTERVAL_SECONDS:-10}
      DB_POOL_MIN: ${IP_MSISDN_DB_POOL_MIN:-1}
      DB_POOL_MAX: ${IP_MSISDN_DB_POOL_MAX:-4}
    command: ["python", "-m", "pipeline.run_pipeline"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: ${PIPELINE_IP_MEM_LIMIT:-2g}
    cpu_shares: ${PIPELINE_IP_CPU_SHARES:-1024}

  pipeline-device-swap:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [camara-network]
    environment:
      <<: *pipeline-environment
      PIPELINE_GROUPS: device-swap
      METRICS_PORT: ${METRICS_PORT_DEVICE_SWAP:-9202}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-16}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      CONSUMERS_PER_GROUP: ${DEVICE_SWAP_CONSUMERS_PER_GROUP:-1}
      DB_APPLICATION_NAME: camara-device-swap
      DATABASE_URL: ${DEVICE_SWAP_DATABASE_URL:-${DATABASE_URL:-postgresql://${POSTGRES_LOCAL_USER:-postgres}:${POSTGRES_LOCAL_PASSWORD:-camara}@camara-postgres:5432/${POSTGRES_LOCAL_DB:-camara_db}}}
      REDIS_HOST: ${DEVICE_SWAP_REDIS_HOST:-${REDIS_HOST:-camara-redis}}
      REDIS_PORT: ${DEVICE_SWAP_REDIS_PORT:-${REDIS_PORT:-6379}}
      REDIS_PASSWORD: ${DEVICE_SWAP_REDIS_PASSWORD:-${REDIS_PASSWORD:-camara_redis_dev_secret}}
      REDIS_DB: ${DEVICE_SWAP_REDIS_DB:-1}
      BATCH_MAX_RECORDS: ${DEVICE_SWAP_BATCH_MAX_RECORDS:-24}
      BATCH_TIMEOUT_MS: ${DEVICE_SWAP_BATCH_TIMEOUT_MS:-2}
      PROCESSING_PARTITION_CONCURRENCY: ${DEVICE_SWAP_PARTITION_CONCURRENCY:-2}
      PROCESSING_PARTITION_QUEUE_RECORDS: ${DEVICE_SWAP_PARTITION_QUEUE_RECORDS:-96}
      THROUGHPUT_LOG_INTERVAL_SECONDS: ${THROUGHPUT_LOG_INTERVAL_SECONDS:-10}
      DB_POOL_MIN: ${DEVICE_SWAP_DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DEVICE_SWAP_DB_POOL_MAX:-4}
      SWAP_CHECKPOINT_INTERVAL_MS: ${SWAP_CHECKPOINT_INTERVAL_MS:-150}
      SWAP_CHECKPOINT_MAX_RECORDS: ${SWAP_CHECKPOINT_MAX_RECORDS:-256}
      SWAP_CHECKPOINT_QUEUE_RECORDS: ${SWAP_CHECKPOINT_QUEUE_RECORDS:-4096}
    command: ["python", "-m", "pipeline.run_pipeline"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9202/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: ${PIPELINE_DEVICE_MEM_LIMIT:-2g}
    cpu_shares: ${PIPELINE_DEVICE_CPU_SHARES:-768}

  pipeline-sim-swap:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [camara-network]
    environment:
      <<: *pipeline-environment
      PIPELINE_GROUPS: sim-swap
      METRICS_PORT: ${METRICS_PORT_SIM_SWAP:-9203}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-16}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      CONSUMERS_PER_GROUP: ${SIM_SWAP_CONSUMERS_PER_GROUP:-1}
      DB_APPLICATION_NAME: camara-sim-swap
      DATABASE_URL: ${SIM_SWAP_DATABASE_URL:-${DATABASE_URL:-postgresql://${POSTGRES_LOCAL_USER:-postgres}:${POSTGRES_LOCAL_PASSWORD:-camara}@camara-postgres:5432/${POSTGRES_LOCAL_DB:-camara_db}}}
      REDIS_HOST: ${SIM_SWAP_REDIS_HOST:-${REDIS_HOST:-camara-redis}}
      REDIS_PORT: ${SIM_SWAP_REDIS_PORT:-${REDIS_PORT:-6379}}
      REDIS_PASSWORD: ${SIM_SWAP_REDIS_PASSWORD:-${REDIS_PASSWORD:-camara_redis_dev_secret}}
      REDIS_DB: ${SIM_SWAP_REDIS_DB:-2}
      BATCH_MAX_RECORDS: ${SIM_SWAP_BATCH_MAX_RECORDS:-24}
      BATCH_TIMEOUT_MS: ${SIM_SWAP_BATCH_TIMEOUT_MS:-2}
      PROCESSING_PARTITION_CONCURRENCY: ${SIM_SWAP_PARTITION_CONCURRENCY:-2}
      PROCESSING_PARTITION_QUEUE_RECORDS: ${SIM_SWAP_PARTITION_QUEUE_RECORDS:-96}
      THROUGHPUT_LOG_INTERVAL_SECONDS: ${THROUGHPUT_LOG_INTERVAL_SECONDS:-10}
      DB_POOL_MIN: ${SIM_SWAP_DB_POOL_MIN:-1}
      DB_POOL_MAX: ${SIM_SWAP_DB_POOL_MAX:-4}
      SWAP_CHECKPOINT_INTERVAL_MS: ${SWAP_CHECKPOINT_INTERVAL_MS:-150}
      SWAP_CHECKPOINT_MAX_RECORDS: ${SWAP_CHECKPOINT_MAX_RECORDS:-256}
      SWAP_CHECKPOINT_QUEUE_RECORDS: ${SWAP_CHECKPOINT_QUEUE_RECORDS:-4096}
    command: ["python", "-m", "pipeline.run_pipeline"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9203/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: ${PIPELINE_SIM_MEM_LIMIT:-2g}
    cpu_shares: ${PIPELINE_SIM_CPU_SHARES:-768}

  radius-ingestion:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks: [camara-network]
    ports:
      - "1813:1813/udp"
    environment:
      <<: *pipeline-environment
      RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET:-camara-radius-dev-secret}
      THROUGHPUT_LOG_INTERVAL_SECONDS: ${THROUGHPUT_LOG_INTERVAL_SECONDS:-10}
      RADIUS_UDP_RECEIVE_BUFFER_BYTES: ${RADIUS_UDP_RECEIVE_BUFFER_BYTES:-33554432}
      RADIUS_UDP_QUEUE_MAX_RECORDS: ${RADIUS_UDP_QUEUE_MAX_RECORDS:-20000}
      RADIUS_UDP_KAFKA_BATCH_RECORDS: ${RADIUS_UDP_KAFKA_BATCH_RECORDS:-64}
      RADIUS_UDP_KAFKA_BATCH_WAIT_MS: ${RADIUS_UDP_KAFKA_BATCH_WAIT_MS:-1}
      RADIUS_UDP_KAFKA_MAX_INFLIGHT_BATCHES_PER_WORKER: ${RADIUS_UDP_KAFKA_MAX_INFLIGHT_BATCHES_PER_WORKER:-6}
      RADIUS_UDP_KAFKA_PRESSURE_INFLIGHT_BATCHES_PER_WORKER: ${RADIUS_UDP_KAFKA_PRESSURE_INFLIGHT_BATCHES_PER_WORKER:-6}
      RADIUS_UDP_KAFKA_PRESSURE_QUEUE_RATIO: ${RADIUS_UDP_KAFKA_PRESSURE_QUEUE_RATIO:-0.25}
      RADIUS_UDP_KAFKA_TOTAL_MAX_INFLIGHT_BATCHES: ${RADIUS_UDP_KAFKA_TOTAL_MAX_INFLIGHT_BATCHES:-24}
      RADIUS_UDP_PUBLISHER_WORKERS: ${RADIUS_UDP_PUBLISHER_WORKERS:-4}
      RADIUS_UDP_KAFKA_PRODUCERS: ${RADIUS_UDP_KAFKA_PRODUCERS:-1}
      INGESTION_BATCH_SIZE_BYTES: ${INGESTION_BATCH_SIZE_BYTES:-524288}
      INGESTION_LINGER_MS: ${INGESTION_LINGER_MS:-0}
      INGESTION_COMPRESSION_TYPE: ${INGESTION_COMPRESSION_TYPE:-lz4}
      INGESTION_KAFKA_ACKS: ${INGESTION_KAFKA_ACKS:-1}
      INGESTION_ENABLE_IDEMPOTENCE: ${INGESTION_ENABLE_IDEMPOTENCE:-false}
      INGESTION_RETRY_BACKOFF_MS: ${INGESTION_RETRY_BACKOFF_MS:-100}
      INGESTION_KAFKA_PERSIST_WARN_MS: ${INGESTION_KAFKA_PERSIST_WARN_MS:-18}
      INGESTION_QUEUE_WARN_MS: ${INGESTION_QUEUE_WARN_MS:-4}
      PIPELINE_SLA_E2E_P95_MS: ${PIPELINE_SLA_E2E_P95_MS:-100}
      PIPELINE_RECOMMENDED_SUSTAINED_PPS: ${PIPELINE_RECOMMENDED_SUSTAINED_PPS:-800}
      PIPELINE_RECOMMENDED_BURST_PPS: ${PIPELINE_RECOMMENDED_BURST_PPS:-900}
      INGESTION_METRICS_PORT: ${INGESTION_METRICS_PORT:-9201}
    command: ["python", "-m", "pipeline.ingestion.producer", "--udp", "--port", "1813"]
    stop_grace_period: 30s
    mem_limit: ${RADIUS_INGESTION_MEM_LIMIT:-1g}
    cpus: ${RADIUS_INGESTION_CPUS:-1}

  notification-dispatcher:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: camara-notification-dispatcher
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [camara-network]
    environment:
      <<: *pipeline-environment
      DISPATCHER_BATCH_SIZE: ${DISPATCHER_BATCH_SIZE:-50}
      DISPATCHER_POLL_INTERVAL: ${DISPATCHER_POLL_INTERVAL:-2.0}
      DISPATCHER_MAX_ATTEMPTS: ${DISPATCHER_MAX_ATTEMPTS:-5}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-camara_webhook_hmac_secret_key}
    command: ["python", "-m", "pipeline.dispatcher.notification_dispatcher"]
    mem_limit: ${DISPATCHER_MEM_LIMIT:-256m}

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: camara-prometheus
    restart: unless-stopped
    depends_on: [fastapi, pipeline-ip-msisdn, pipeline-device-swap, pipeline-sim-swap]
    networks: [camara-network]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-256m}

  grafana:
    image: grafana/grafana:10.0.0
    container_name: camara-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    networks: [camara-network]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}