name: camara-pipeline

networks:
  camara-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:

x-pipeline-environment: &pipeline-environment
  KAFKA_BOOTSTRAP_SERVERS: camara-kafka:9092
  KAFKA_TOPIC_RAW: radius.accounting.raw
  REDIS_HOST: camara-redis
  REDIS_PORT: "6379"
  DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-camara}@camara-postgres:5432/${DB_NAME:-camara_db}
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "12"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: camara-zookeeper
    restart: unless-stopped
    networks: [camara-network]
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: camara-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    networks: [camara-network]
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: camara-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://camara-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_HEAP_OPTS: -Xmx1536m -Xms1536m
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    mem_limit: 3g
    cpus: 2

  postgres:
    image: postgres:15-alpine
    container_name: camara-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "synchronous_commit=on", "-c", "max_connections=120", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=1536MB", "-c", "work_mem=8MB", "-c", "max_wal_size=2GB", "-c", "checkpoint_timeout=15min"]
    networks: [camara-network]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-camara}
      POSTGRES_DB: ${DB_NAME:-camara_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-camara_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 2

  redis:
    image: redis:7-alpine
    container_name: camara-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    networks: [camara-network]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 640m

  migrate:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    networks: [camara-network]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *pipeline-environment
    command: ["python", "-m", "storage.migrate"]
    restart: "no"

  fastapi:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fastapi-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [camara-network]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-camara}@camara-postgres:5432/${DB_NAME:-camara_db}
      DB_POOL_SIZE: "10"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_KEY: ${API_KEY:-dev-secret}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: camara-pipeline
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [camara-network]
    environment:
      <<: *pipeline-environment
      METRICS_PORT: "9200"
      KAFKA_TOPIC_PARTITIONS: "8"
    command: ["python", "-m", "pipeline.run_pipeline"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 2g
    cpus: 2

  radius-ingestion:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: camara-radius-ingestion
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks: [camara-network]
    ports:
      - "1813:1813/udp"
    environment:
      <<: *pipeline-environment
      RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET:-camara-radius-dev-secret}
    command: ["python", "-m", "pipeline.ingestion.producer", "--udp", "--port", "1813"]
    mem_limit: 512m

  notification-dispatcher:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: camara-notification-dispatcher
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [camara-network]
    environment:
      <<: *pipeline-environment
      DISPATCHER_BATCH_SIZE: "50"
      DISPATCHER_POLL_INTERVAL: "2"
      DISPATCHER_MAX_ATTEMPTS: "5"
    command: ["python", "-m", "pipeline.dispatcher.notification_dispatcher"]
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: camara-prometheus
    restart: unless-stopped
    depends_on: [fastapi, pipeline]
    networks: [camara-network]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 256m

  grafana:
    image: grafana/grafana:10.0.0
    container_name: camara-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    networks: [camara-network]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    mem_limit: 256m
