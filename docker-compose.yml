name: camara-pipeline

networks:
  camara-network:
    name: camara-network
    driver: bridge
    external: true

volumes:
  postgres_data:
  grafana_data:
  redis_data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: camara-zookeeper
    networks:
      - camara-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: camara-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - camara-network
    ports:
      - "9092:9092"
      - "29092:29092" # Thêm cổng này
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: camara-zookeeper:2181
      # Sửa lại phần này:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://camara-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"   # THÊM: bound JVM heap Kafka rõ ràng
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  postgres:
    image: postgres:15-alpine
    container_name: camara-postgres
    command: [
      "postgres",
      "-c", "synchronous_commit=off",
      "-c", "max_connections=200",
      "-c", "shared_buffers=512MB",
      "-c", "work_mem=8MB",
      "-c", "max_wal_size=2GB",
      "-c", "wal_buffers=16MB",
      "-c", "checkpoint_timeout=15min"
    ]
    mem_limit: 768m
    networks:
      - camara-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: camara
      POSTGRES_DB: camara_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d camara_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: camara-redis
    # Cache layer cho 3 consumer modules:
    #   - cg-ip-msisdn: ip-ggsn:<framed_ip>, ggsn-ips:<nas_id>
    #   - cg-device-swap: device:<msisdn>
    #   - cg-sim-swap: sim:<msisdn>
    # Xem pipeline/modules/{ip_msisdn,device_swap,sim_swap}/consumer.py
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - camara-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: 640m

  fastapi:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fastapi-app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - camara-network
    mem_limit: 256m
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:camara@camara-postgres:5432/camara_db
      - DB_HOST=camara-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=camara
      - DB_NAME=camara_db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: camara-pipeline
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - camara-network
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=camara-kafka:9092
      - KAFKA_TOPIC_RAW=radius.accounting.raw
      - REDIS_HOST=camara-redis
      - REDIS_PORT=6379
      - DB_HOST=camara-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=camara
      - DB_NAME=camara_db
    volumes:
      - .:/workspace
    command: ["python", "-m", "pipeline.run_pipeline"]

    
 
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: camara-prometheus
    depends_on:
      - fastapi
    networks:
      - camara-network
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    mem_limit: 256m
  grafana:
    image: grafana/grafana:10.0.0
    container_name: camara-grafana
    depends_on:
      - prometheus
    networks:
      - camara-network
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    mem_limit: 256m