# infra/prometheus/prometheus.yml
# F-08: Chỉ giữ target thật tồn tại trong docker-compose.yml hiện tại.
# Đã xoá: spark-pipeline, postgres-exporter, gsma-tac-mock, hlr-hss-mock, itu-e164-mock
# — không container nào phục vụ các target này.

global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  # 1. FastAPI — CAMARA Network API
  - job_name: 'fastapi-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fastapi:8000']

  # 2. Pipeline consumers. DNS discovery is required because hardware profiles
  # may scale each service to multiple Compose replicas.
  - job_name: 'pipeline-ip-msisdn'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['pipeline-ip-msisdn']
        type: A
        port: 9200
        refresh_interval: 10s

  - job_name: 'pipeline-device-swap'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['pipeline-device-swap']
        type: A
        port: 9202
        refresh_interval: 10s

  - job_name: 'pipeline-sim-swap'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['pipeline-sim-swap']
        type: A
        port: 9203
        refresh_interval: 10s

  # 3. RADIUS Ingestion Receiver — Prometheus metrics server
  - job_name: 'radius-ingestion'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['radius-ingestion:9201', 'host.docker.internal:9201']
