# infra/prometheus/prometheus.yml
# F-08: Chỉ giữ target thật tồn tại trong docker-compose.yml hiện tại.
# Đã xoá: spark-pipeline, postgres-exporter, gsma-tac-mock, hlr-hss-mock, itu-e164-mock
# — không container nào phục vụ các target này.

global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  # 1. FastAPI — CAMARA Network API
  - job_name: 'fastapi-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fastapi:8000']

  # 2. Pipeline consumers — Prometheus metrics server
  - job_name: 'pipeline'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['pipeline-ip-msisdn:9200', 'pipeline-device-swap:9202', 'pipeline-sim-swap:9203']

  # 3. RADIUS Ingestion Receiver — Prometheus metrics server
  - job_name: 'radius-ingestion'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['radius-ingestion:9201', 'host.docker.internal:9201']