# infra/prometheus/prometheus.yml
# F-08: Chỉ giữ target thật tồn tại trong docker-compose.yml hiện tại.
# Đã xoá: spark-pipeline, postgres-exporter, gsma-tac-mock, hlr-hss-mock, itu-e164-mock
# — không container nào phục vụ các target này.

global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # 1. FastAPI — CAMARA Network API
  - job_name: 'fastapi-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fastapi:8000']

  # 2. Pipeline consumers — Prometheus metrics server (F-08)
  - job_name: 'pipeline'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['pipeline:9200']