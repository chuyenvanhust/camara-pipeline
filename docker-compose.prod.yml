# docker-compose.prod.yml
# F-PARALLEL: Override dùng khi chuyển sang HOST LINUX nhiều core (không áp dụng
# cho Docker Desktop Windows/macOS — network_mode: host chỉ hoạt động trên Linux).
#
# Dùng kèm file gốc và đúng hardware profile:
#   docker compose --env-file .env --env-file config/env/32gb.env \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build \
#     --scale radius-ingestion=${RADIUS_INGESTION_REPLICAS:-4} \
#     --scale pipeline-ip-msisdn=${PIPELINE_IP_REPLICAS:-6} \
#     --scale pipeline-device-swap=${PIPELINE_DEVICE_REPLICAS:-6} \
#     --scale pipeline-sim-swap=${PIPELINE_SIM_REPLICAS:-6}
#
# Vì sao cần override riêng thay vì sửa thẳng docker-compose.yml:
# - `network_mode: host` bỏ qua `ports:`/network alias, không tương thích khi
#   test trên Windows/macOS (Docker Desktop chạy trong 1 VM, host ở đây là VM
#   đó chứ không phải Windows thật) -> giữ docker-compose.yml mặc định an toàn
#   cho dev Windows, chỉ bật host networking khi thật sự chạy trên Linux.
# - Production bổ sung Redis master + 2 replica + 3 Sentinel. Pipeline/API tự
#   discovery master qua REDIS_SENTINELS và tiếp tục sau failover.
services:
  redis-replica-1: &redis-replica
    image: redis:7-alpine
    restart: unless-stopped
    networks: [camara-network]
    command: ["redis-server", "--replicaof", "camara-redis", "6379", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-camara_redis_dev_secret}", "--masterauth", "${REDIS_PASSWORD:-camara_redis_dev_secret}", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "noeviction"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${REDIS_REPLICA_MEM_LIMIT:-640m}

  redis-replica-2:
    <<: *redis-replica

  redis-sentinel-1: &redis-sentinel
    image: redis:7-alpine
    restart: unless-stopped
    networks: [camara-network]
    command: ["sh", "-c", "cp /config/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/config/sentinel.conf:ro
    depends_on:
      redis:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${REDIS_SENTINEL_MEM_LIMIT:-128m}

  redis-sentinel-2:
    <<: *redis-sentinel

  redis-sentinel-3:
    <<: *redis-sentinel

  radius-ingestion:
    network_mode: host
    networks: !reset []
    ports: !reset []   # network_mode: host không dùng ports mapping
    environment:
      ENVIRONMENT: production
      RADIUS_UDP_SO_REUSEPORT: "true"
      # F-PARALLEL-FIX: network_mode: host gỡ container khỏi bridge network
      # camara-network -> tên DNS nội bộ (camara-kafka...) không resolve được
      # nữa, phải trỏ qua các port đã publish ra host (29092-29094).
      KAFKA_BOOTSTRAP_SERVERS: "localhost:29092,localhost:29093,localhost:29094"
      RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET:?RADIUS_SHARED_SECRET is required in production}
    # Nhiều container cùng bind UDP/1813 nhờ SO_REUSEPORT (packet_reader.py) ->
    # kernel Linux tự load-balance datagram giữa các container -> parallel thật,
    # mỗi container là 1 process riêng, không còn bị GIL của asyncio chia sẻ.

  pipeline-ip-msisdn: &pipeline-prod-override
    environment:
      ENVIRONMENT: production
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: camara-master
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?WEBHOOK_SIGNING_SECRET is required in production}
      ALLOW_HTTP_WEBHOOKS: "false"
    depends_on:
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy

  pipeline-device-swap:
    <<: *pipeline-prod-override

  pipeline-sim-swap:
    <<: *pipeline-prod-override

  fastapi:
    environment:
      ENVIRONMENT: production
      API_KEY: ${API_KEY:?API_KEY is required in production}
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: camara-master
    depends_on:
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required in production}

# CPU, memory, partition, batching và pool không được lặp lại ở override này.
# Chúng luôn đến từ config/env/<tier>.env để base/prod dùng cùng một nguồn chuẩn.
